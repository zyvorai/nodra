services:
  control-plane:
    build: .
    image: nodra:dev
    environment:
      NODRA_ADMIN_TOKEN: ${NODRA_ADMIN_TOKEN:-nodra-demo-admin}
      NODRA_ADMIN_USER: ${NODRA_ADMIN_USER:-admin}
      NODRA_ADMIN_PASSWORD: ${NODRA_ADMIN_PASSWORD:-nodra-demo-admin}
      NODRA_ENROLLMENT_TOKEN: ${NODRA_ENROLLMENT_TOKEN:-nodra-demo-enroll}
      NODRA_DATA_DIR: /var/lib/nodra
    ports:
      - "8080:8080"
    volumes:
      - control-data:/var/lib/nodra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  edge-agent:
    image: nodra:dev
    depends_on:
      control-plane:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /var/lib/nodra/nodrad.json ]; then
          nodrad init --config /var/lib/nodra/nodrad.json --server http://control-plane:8080 --site compose-edge --enrollment-token "$${NODRA_ENROLLMENT_TOKEN}" --data /var/lib/nodra/agent --listen 0.0.0.0:9091 --local-token "$${NODRA_LOCAL_TOKEN}"
        fi
        exec nodrad --config /var/lib/nodra/nodrad.json
    environment:
      NODRA_ENROLLMENT_TOKEN: ${NODRA_ENROLLMENT_TOKEN:-nodra-demo-enroll}
      NODRA_LOCAL_TOKEN: ${NODRA_LOCAL_TOKEN:-nodra-demo-local}
    ports:
      - "9091:9091"
    volumes:
      - agent-data:/var/lib/nodra

  simulation:
    image: nodra:dev
    depends_on:
      control-plane:
        condition: service_healthy
    entrypoint: ["nodra-sim"]
    command:
      - --server=http://control-plane:8080
      - --interval=8s
      - --sites=26
      - --state=/tmp/nodra-sim-state.json
    environment:
      NODRA_ADMIN_TOKEN: ${NODRA_ADMIN_TOKEN:-nodra-demo-admin}
      NODRA_ENROLLMENT_TOKEN: ${NODRA_ENROLLMENT_TOKEN:-nodra-demo-enroll}
    volumes:
      - sim-tmp:/tmp

volumes:
  control-data: {}
  agent-data: {}
  sim-tmp: {}

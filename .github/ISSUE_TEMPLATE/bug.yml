name: Bug report
description: Report reproducible Nodra behavior
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: Include the expected and actual behavior.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Minimal commands/config with secrets removed.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Nodra version}
    validations: {required: true}
  - type: textarea
    id: env
    attributes: {label: Environment, description: OS, architecture, Docker/Kubernetes versions if relevant.}

name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {go: ['1.25.x', '1.27.x']}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '${{ matrix.go }}', cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-ci.txt
      - name: Formatting
        run: make fmt
      - name: Vet
        run: make vet
      - name: OpenAPI route coverage
        run: python3 scripts/openapi-coverage.py
      - name: Release checks
        # release-check also runs gofmt, vet, and go test -race (plus build/smoke).
        run: ./scripts/release-check.sh
      - name: Software qualification matrix
        if: matrix.go == '1.27.x'
        run: NODRA_QUALIFY_FAST=1 make qualify
      - name: Coverage
        if: matrix.go == '1.27.x'
        run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        if: matrix.go == '1.27.x'
        with: {name: coverage, path: coverage.out}
      - uses: actions/upload-artifact@v7
        if: matrix.go == '1.27.x'
        with: {name: qualification-matrix, path: evidence/qualification/software-matrix.json}
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.x', cache: false}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: 'nodra:ci'}
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v5
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.x', cache: false}
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
      - run: helm lint charts/nodra --set secrets.adminToken=test-admin --set secrets.enrollmentToken=test-enroll
      - run: helm template nodra charts/nodra --namespace nodra-system --set secrets.adminToken=test-admin --set secrets.enrollmentToken=test-enroll > /tmp/nodra.yaml
      - run: helm template nodra charts/nodra -f charts/nodra/values-demo.yaml --namespace nodra-demo --set image.repository=nodra --set image.tag=demo > /tmp/nodra-demo.yaml
      - run: helm template nodra charts/nodra -f charts/nodra/values-production.yaml --namespace nodra > /tmp/nodra-production.yaml
      - run: grep -q 'kind: Certificate' /tmp/nodra-production.yaml && grep -q 'kind: PodMonitor' /tmp/nodra-production.yaml && grep -q 'helm.sh/hook: test' /tmp/nodra-production.yaml && grep -q 'existingSecret' charts/nodra/values-production.yaml && ! grep -q 'kind: Secret' /tmp/nodra-production.yaml
      - run: helm template nodra charts/nodra --namespace nodra --set backup.enabled=true --set backup.host=10.8.0.10 --set backup.existingClaim=nodra-dumps --set secrets.adminToken=test-admin --set secrets.enrollmentToken=test-enroll > /tmp/nodra-backup.yaml
      - run: grep -q 'kind: CronJob' /tmp/nodra-backup.yaml
      - run: kubectl kustomize --load-restrictor LoadRestrictionsNone deployments/kustomize/base > /tmp/kustomized.yaml
      - run: kubectl kustomize --load-restrictor LoadRestrictionsNone deployments/kustomize/demo > /tmp/kustomized-demo.yaml
      # kubectl apply --dry-run=client still requires live API discovery (it needs
      # RESTMapping/OpenAPI to merge the last-applied-config annotation), so it
      # cannot validate manifests without a real cluster. kubeconform validates
      # structure against the upstream Kubernetes OpenAPI schemas entirely offline.
      - run: kubeconform -summary -strict /tmp/nodra.yaml /tmp/nodra-demo.yaml /tmp/kustomized.yaml /tmp/kustomized-demo.yaml
      # Production adds cert-manager Certificate and Prometheus PodMonitor/PrometheusRule.
      # Those CRDs are not in the stock Kubernetes schemas; core objects stay strict.
      - run: kubeconform -summary -strict -ignore-missing-schemas /tmp/nodra-production.yaml /tmp/nodra-backup.yaml

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodra
          POSTGRES_PASSWORD: nodra
          POSTGRES_DB: nodra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nodra -d nodra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.x', cache: false}
      - name: Postgres fleet store tests
        env:
          NODRA_DATABASE_URL: postgres://nodra:nodra@127.0.0.1:5432/nodra?sslmode=disable
        run: go test ./internal/store/ -count=1 -run Postgres -v
      - name: Postgres delivery/DLQ + leader-lock tests
        env:
          NODRA_DATABASE_URL: postgres://nodra:nodra@127.0.0.1:5432/nodra?sslmode=disable
        run: go test ./internal/queue/... ./internal/leader/... -count=1 -run Postgres -v
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Postgres dump and restore
        env:
          NODRA_DATABASE_URL: postgres://nodra:nodra@127.0.0.1:5432/nodra?sslmode=disable
        run: |
          set -euo pipefail
          chmod +x scripts/backup-postgres.sh scripts/restore-postgres.sh
          psql "$NODRA_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE nodra_backup_probe(id int); INSERT INTO nodra_backup_probe VALUES (7);'
          out=$(mktemp -d)
          scripts/backup-postgres.sh "$out"
          dump=$(python3 -c 'import glob,sys; print(sorted(glob.glob(sys.argv[1]))[-1])' "$out"/nodra-*.dump)
          if scripts/restore-postgres.sh "$dump"; then
            echo "restore without NODRA_RESTORE_FORCE must fail"
            exit 1
          fi
          psql "$NODRA_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE nodra_backup_probe;'
          NODRA_RESTORE_FORCE=1 scripts/restore-postgres.sh "$dump"
          got=$(psql "$NODRA_DATABASE_URL" -tAc 'SELECT id FROM nodra_backup_probe' | tr -d '[:space:]')
          test "$got" = "7"

  relay-bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.x', cache: false}
      - run: chmod +x scripts/smoke-relay-bridge.sh && ./scripts/smoke-relay-bridge.sh

  compose-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compose control-plane + edge smoke
        run: |
          chmod +x scripts/ci/compose-smoke.sh
          ./scripts/ci/compose-smoke.sh

  compose-relay-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose relay-bridge example
        run: |
          set -euo pipefail
          docker compose -f examples/relay/docker-compose.bridge.yml up --build -d
          docker compose -f examples/relay/docker-compose.bridge.yml ps
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18096/healthz >/dev/null 2>&1; then
              break
            fi
            echo "waiting for bridge… ($i)"
            docker compose -f examples/relay/docker-compose.bridge.yml logs bridge 2>&1 | tail -5 || true
            sleep 2
          done
          curl -fsS http://127.0.0.1:18096/healthz
          # Retry delivery briefly — mock Relay may still be binding.
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS -X POST http://127.0.0.1:18096/v1/nodra/delivery \
              -H 'Content-Type: application/json' \
              -d '{"event_id":"edge_ci_1","site_id":"site_ci","topic":"factory/line-1/alert","payload":{"ok":true},"delivery_id":"dlv_ci_1","event_time":"2026-09-14T00:00:00Z"}' \
              | tee /tmp/bridge-out.json | grep -Fq '"accepted":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          docker compose -f examples/relay/docker-compose.bridge.yml down -v

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.x', cache: false}
      - run: |
          chmod +x scripts/ci/backup-restore.sh scripts/backup-state.sh scripts/restore-state.sh
          ./scripts/ci/backup-restore.sh

  soak-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Short WAN/disk soak (PR-gated)
        env:
          NODRA_SOAK_DURATION: "10m"
          NODRA_SOAK_WAN_CYCLE: "90s"
          NODRA_SOAK_WAN_DOWNTIME: "10s"
          NODRA_SOAK_DISK_CYCLE: "60s"
          NODRA_SOAK_SAMPLE_INTERVAL: "5s"
        run: |
          chmod +x scripts/ci/soak.sh
          ./scripts/ci/soak.sh evidence/qualification/ci/soak-short
      - name: Judge soak criteria
        if: always()
        run: python3 scripts/ci/soak-check.py evidence/qualification/ci/soak-short/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: soak-short-evidence, path: evidence/qualification/ci/soak-short}

  suite-ci:
    needs: [test, vuln, container, kubernetes, postgres, relay-bridge-smoke, compose-stack, compose-relay-bridge, backup-restore, soak-short]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.x', cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-ci.txt
      - name: Qualify with CI markers
        env:
          NODRA_QUALIFY_FAST: "1"
          NODRA_CI_BACKUP: "1"
          NODRA_CI_POSTGRES_BACKUP: "1"
          NODRA_CI_RELAY_BRIDGE: "1"
          NODRA_CI_COMPOSE: "1"
          NODRA_CI_COMPOSE_BRIDGE: "1"
          NODRA_CI_SOAK_SHORT: "1"
        run: make qualify
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-suite-ci
          path: evidence/qualification/software-matrix.json
          if-no-files-found: error

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodra-server
  namespace: nodra-system
  labels: {app.kubernetes.io/name: nodra, app.kubernetes.io/component: control-plane}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: nodra, app.kubernetes.io/component: control-plane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nodra, app.kubernetes.io/component: control-plane}
    spec:
      serviceAccountName: nodra-server
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nodra-server
          image: ghcr.io/zyvorai/nodra:0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODRA_DATA_DIR
              value: /var/lib/nodra
            - name: NODRA_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: nodra-secrets, key: admin-token}}
            - name: NODRA_ENROLLMENT_TOKEN
              valueFrom: {secretKeyRef: {name: nodra-secrets, key: enrollment-token}}
            - name: NODRA_DELIVERY_WORKERS
              value: "8"
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /var/lib/nodra}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: nodra-data}}
        - {name: tmp, emptyDir: {}}

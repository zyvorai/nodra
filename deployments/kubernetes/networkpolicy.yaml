apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nodra-server
  namespace: nodra-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nodra, app.kubernetes.io/component: control-plane}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}

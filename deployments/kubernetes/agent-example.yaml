# Optional edge-cluster agent example. Use a PVC so the store-and-forward spool survives restarts.
apiVersion: v1
kind: Secret
metadata:
  name: nodra-agent-bootstrap
  namespace: nodra-system
stringData:
  enrollment-token: replace-me
  local-token: replace-me-too
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodra-agent-data
  namespace: nodra-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodra-agent
  namespace: nodra-system
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: nodra-agent}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nodra-agent}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: init-config
          image: ghcr.io/zyvorai/nodra:0.2.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /data/nodrad.json ]; then
                nodrad init --config /data/nodrad.json --server "$NODRA_SERVER" --site "$NODRA_SITE" --enrollment-token "$NODRA_ENROLLMENT_TOKEN" --data /data/spool --listen 0.0.0.0:9091 --mqtt-listen 0.0.0.0:1883 --max-spool-bytes 2147483648 --max-spool-events 1000000 --spool-policy reject --local-token "$NODRA_LOCAL_TOKEN"
              fi
          env:
            - {name: NODRA_SERVER, value: "https://nodra.example.com"}
            - {name: NODRA_SITE, value: "edge-site-01"}
            - {name: NODRA_ENROLLMENT_TOKEN, valueFrom: {secretKeyRef: {name: nodra-agent-bootstrap, key: enrollment-token}}}
            - {name: NODRA_LOCAL_TOKEN, valueFrom: {secretKeyRef: {name: nodra-agent-bootstrap, key: local-token}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: nodrad
          image: ghcr.io/zyvorai/nodra:0.2.0
          command: ["nodrad", "--config", "/data/nodrad.json"]
          ports: [{name: ingest, containerPort: 9091}, {name: mqtt, containerPort: 1883}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: nodra-agent-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: nodra-agent
  namespace: nodra-system
spec:
  selector: {app.kubernetes.io/name: nodra-agent}
  ports: [{name: ingest, port: 9091, targetPort: ingest}, {name: mqtt, port: 1883, targetPort: mqtt}]

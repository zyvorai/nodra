# Demo secret for raw manifests / kustomize. Apply before the control plane.
apiVersion: v1
kind: Secret
metadata:
  name: nodra-secrets
  namespace: nodra-system
type: Opaque
stringData:
  admin-token: nodra-demo-admin
  admin-user: admin
  admin-password: nodra-demo-admin
  enrollment-token: nodra-demo-enroll
  agent-local-token: nodra-demo-local

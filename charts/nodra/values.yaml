image:
  repository: ghcr.io/zyvorai/nodra
  tag: "0.2.0"
  pullPolicy: IfNotPresent

replicaCount: 1 # v0.2 embedded WAL state is single-writer by design.
service:
  type: ClusterIP
  port: 8080
  nodePort: null # set e.g. 30059 when type=NodePort

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: [{host: nodra.example.com, paths: [{path: /, pathType: Prefix}]}]
  tls: []

persistence: {enabled: true, size: 5Gi, storageClass: ""}
secrets:
  adminToken: ""
  adminUser: admin
  adminPassword: "" # defaults to adminToken when empty
  enrollmentToken: ""

server:
  deliveryWorkers: 8
  pkiEnabled: false

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
podSecurityContext: {runAsNonRoot: true, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
containerSecurityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: ["ALL"]}}
networkPolicy: {enabled: true}
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1 # avoids blocking node drains for the intentionally single-replica v0.2 server
nodeSelector: {}
tolerations: []
affinity: {}

agent:
  enabled: false
  siteName: edge-site-01
  serverURL: "http://nodra:8080"
  localToken: ""
  mqttListen: "0.0.0.0:1883"
  maxSpoolBytes: 2147483648
  maxSpoolEvents: 1000000
  spoolPolicy: reject
  persistence: {enabled: true, size: 2Gi, storageClass: ""}
  service: {enabled: true, port: 9091, mqttPort: 1883}
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

# Customer-demo fleet simulator (nodra-sim). Seeds sites/devices/routes and keeps heartbeats alive.
simulation:
  enabled: false
  serverURL: "http://nodra:8080"
  interval: 8s
  sites: 26
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 250m, memory: 128Mi}

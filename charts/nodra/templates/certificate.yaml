{{- if .Values.certManager.enabled }}
{{- if not .Values.certManager.issuerName }}
{{- fail "certManager.enabled requires certManager.issuerName" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "nodra.fullname" . }}-tls
  labels:
    {{- include "nodra.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certManager.secretName | default (printf "%s-tls" (include "nodra.fullname" .)) }}
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: {{ .Values.certManager.issuerKind }}
  dnsNames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
{{- end }}

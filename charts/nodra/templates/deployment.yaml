apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodra.fullname" . }}
  labels:
    {{- include "nodra.labels" . | nindent 4 }}
spec:
  {{- if and (eq .Values.server.store "file") (gt (int .Values.replicaCount) 1) }}
  {{- fail "nodra file store requires replicaCount 1 because the data volume is ReadWriteOnce" }}
  {{- end }}
  # Default is one replica. File mode cannot scale. Postgres may set replicaCount
  # above 1: fleet state is read from the database with revision checks. That is
  # not a full HA claim (soak, PITR, and the remaining 1.0 gates are still open).
  replicas: {{ .Values.replicaCount }}
  {{- if and (eq .Values.server.store "postgres") (gt (int .Values.replicaCount) 1) }}
  strategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "nodra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nodra.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nodra.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nodra-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "nodra.fullname" . }}-config}
          env:
            - name: NODRA_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: admin-token}}
            - name: NODRA_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: admin-user}}
            - name: NODRA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: admin-password}}
            - name: NODRA_VIEWER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: viewer-token, optional: true}}
            - name: NODRA_VIEWER_USER
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: viewer-user, optional: true}}
            - name: NODRA_VIEWER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: viewer-password, optional: true}}
            - name: NODRA_ENROLLMENT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: enrollment-token}}
            {{- if eq (.Values.server.store | default "file") "postgres" }}
            - name: NODRA_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: database-url}}
            {{- end }}
            {{- if .Values.server.tls.existingSecret }}
            - {name: NODRA_TLS_CERT, value: /tls/tls.crt}
            - {name: NODRA_TLS_KEY, value: /tls/tls.key}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/nodra}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.server.tls.existingSecret }}
            - {name: tls, mountPath: /tls, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "nodra.fullname" . }}-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - {name: tmp, emptyDir: {}}
        {{- if .Values.server.tls.existingSecret }}
        - name: tls
          secret: {secretName: {{ .Values.server.tls.existingSecret }}}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

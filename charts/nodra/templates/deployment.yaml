apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodra.fullname" . }}
  labels:
    {{- include "nodra.labels" . | nindent 4 }}
spec:
  {{- if and (eq .Values.server.store "file") (gt (int .Values.replicaCount) 1) }}
  {{- fail "nodra file store requires replicaCount 1 because the data volume is ReadWriteOnce" }}
  {{- end }}
  # Default is one replica. File mode cannot scale. Postgres may set replicaCount
  # above 1: fleet state is read from the database with revision checks. That is
  # not a full HA claim (soak, PITR, and the remaining 1.0 gates are still open).
  replicas: {{ .Values.replicaCount }}
  {{- if and (eq .Values.server.store "postgres") (gt (int .Values.replicaCount) 1) }}
  strategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "nodra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nodra.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nodra.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nodra-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: NODRA_DATA_DIR, value: /var/lib/nodra}
            - name: NODRA_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: admin-token}}
            - name: NODRA_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: admin-user}}
            - name: NODRA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: admin-password}}
            - name: NODRA_VIEWER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: viewer-token, optional: true}}
            - name: NODRA_VIEWER_USER
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: viewer-user, optional: true}}
            - name: NODRA_VIEWER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: viewer-password, optional: true}}
            - name: NODRA_ENROLLMENT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: enrollment-token}}
            - {name: NODRA_DELIVERY_WORKERS, value: {{ .Values.server.deliveryWorkers | quote }}}
            - {name: NODRA_PKI_ENABLED, value: {{ .Values.server.pkiEnabled | quote }}}
            - {name: NODRA_STORE, value: {{ .Values.server.store | default "file" | quote }}}
            {{- if eq (.Values.server.store | default "file") "postgres" }}
            - name: NODRA_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "nodra.fullname" . }}-secrets, key: database-url}}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /var/lib/nodra}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "nodra.fullname" . }}-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - {name: tmp, emptyDir: {}}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nodra.fullname" . }}
  labels:
    {{- include "nodra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nodra.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports: [{protocol: TCP, port: {{ .Values.service.port }}}]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.monitoring.podMonitor.enabled }}
    - ports: [{protocol: TCP, port: {{ .Values.service.port }}}]
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.podMonitor.namespace | quote }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.networkPolicy.egress.rules }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports: [{protocol: {{ .protocol | default "TCP" }}, port: {{ .port }}}]
    {{- end }}
  {{- end }}
{{- end }}

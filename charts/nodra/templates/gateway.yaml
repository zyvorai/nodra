{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway }}
{{- $ing := .Values.ingress }}
{{- $full := (include "nodra.fullname" .) }}
# Gateway API front door served by Setura (https://github.com/zyvorai/zyvor-setura-gateway).
# Install the controller once per cluster:
#   setura gateway install --image ghcr.io/zyvorai/zyvor-setura-gateway:0.7.0 --namespace setura-system | kubectl apply -f -
# The Ingress template stays available; enable this instead of `ingress.enabled`, not as well.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $full }}
  labels:
    {{- include "nodra.labels" $ | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ $gw.httpPort }}
      allowedRoutes:
        namespaces:
          from: Same
{{- if and $gw.tls $gw.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ $gw.httpsPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $gw.tls.secretName | default (printf "%s-tls" $full) }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
{{- /* One HTTPRoute per Ingress host; with no hosts, a single catch-all route. */}}
{{- $hosts := $ing.hosts | default (list (dict)) }}
{{- range $i, $h := $hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ if eq $i 0 }}{{ $full }}{{ else }}{{ printf "%s-%d" $full $i }}{{ end }}
  labels:
    {{- include "nodra.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $full }}
  {{- if $h.host }}
  hostnames:
    - {{ $h.host | quote }}
  {{- end }}
  rules:
    {{- range ($h.paths | default (list (dict "path" "/" "pathType" "Prefix"))) }}
    - matches:
        - path:
            type: {{ if eq (.pathType | default "Prefix") "Exact" }}Exact{{ else }}PathPrefix{{ end }}
            value: {{ .path | default "/" }}
      backendRefs:
        - name: {{ $full }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
{{- end }}

{{- if .Values.agent.enabled }}
{{- if .Values.agent.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nodra.fullname" . }}-agent-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.agent.persistence.storageClass }}
  storageClassName: {{ .Values.agent.persistence.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.agent.persistence.size }}}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodra.fullname" . }}-agent
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: nodra-agent, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nodra-agent, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: configure
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /data/nodrad.json ]; then
                nodrad init --config /data/nodrad.json --server "$NODRA_SERVER" --site "$NODRA_SITE" --enrollment-token "$NODRA_ENROLLMENT_TOKEN" --data /data/spool --listen 0.0.0.0:9091 --mqtt-listen {{ .Values.agent.mqttListen }} --max-spool-bytes {{ .Values.agent.maxSpoolBytes }} --max-spool-events {{ .Values.agent.maxSpoolEvents }} --spool-policy {{ .Values.agent.spoolPolicy }} --local-token "$NODRA_LOCAL_TOKEN"{{- if .Values.agent.mqtt.tls.existingSecret }} --mqtt-tls-cert /mqtt-tls/tls.crt --mqtt-tls-key /mqtt-tls/tls.key{{- if .Values.agent.mqtt.tls.requireClientCert }} --mqtt-client-ca /mqtt-tls/ca.crt --mqtt-require-client-cert{{- end }}{{- end }}
              fi
          env:
            - {name: NODRA_SERVER, value: {{ .Values.agent.serverURL | quote }}}
            - {name: NODRA_SITE, value: {{ .Values.agent.siteName | quote }}}
            - name: NODRA_ENROLLMENT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: enrollment-token}}
            - name: NODRA_LOCAL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nodra.secretName" . }}, key: agent-local-token}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.agent.mqtt.tls.existingSecret }}
            - {name: mqtt-tls, mountPath: /mqtt-tls, readOnly: true}
            {{- end }}
      containers:
        - name: nodrad
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nodrad", "--config", "/data/nodrad.json"]
          ports: [{name: ingest, containerPort: 9091}, {name: mqtt, containerPort: 1883}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.agent.mqtt.tls.existingSecret }}
            - {name: mqtt-tls, mountPath: /mqtt-tls, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.agent.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "nodra.fullname" . }}-agent-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.agent.mqtt.tls.existingSecret }}
        - name: mqtt-tls
          secret: {secretName: {{ .Values.agent.mqtt.tls.existingSecret }}}
        {{- end }}
{{- if .Values.agent.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodra.fullname" . }}-agent
spec:
  selector: {app.kubernetes.io/name: nodra-agent, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: ingest, port: {{ .Values.agent.service.port }}, targetPort: ingest}, {name: mqtt, port: {{ .Values.agent.service.mqttPort }}, targetPort: mqtt}]
{{- end }}
{{- end }}

openapi: 3.1.0
info:
  title: Nodra Edge API
  version: 0.2.2
  description: Offline-first edge runtime and control-plane API.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    EventInput:
      type: object
      required: [site_id, topic, payload]
      properties:
        event_id: {type: string}
        site_id: {type: string}
        topic: {type: string}
        payload: {}
        headers: {type: object, additionalProperties: {type: string}}
        event_time: {type: string, format: date-time}
    Route:
      type: object
      required: [name, topic, target_url]
      properties:
        id: {type: string}
        name: {type: string}
        site_id: {type: string}
        topic: {type: string}
        target_url: {type: string, format: uri}
        method: {type: string, enum: [POST, PUT, PATCH]}
        enabled: {type: boolean}
        retry_max: {type: integer, minimum: 1, maximum: 20}
        timeout_seconds: {type: integer, minimum: 1, maximum: 60}
    Twin:
      type: object
      properties:
        device_id: {type: string}
        site_id: {type: string}
        desired: {type: object}
        reported: {type: object}
        desired_version: {type: integer}
        reported_version: {type: integer}
    ActivityEntry:
      type: object
      required: [message]
      properties:
        id: {type: string}
        time: {type: string, format: date-time}
        level: {type: string, enum: [info, warn, error, chapter, ok]}
        source: {type: string}
        chapter: {type: string}
        site_id: {type: string}
        site: {type: string}
        action: {type: string}
        message: {type: string}
        detail: {type: object}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
paths:
  /version:
    get:
      responses: {'200': {description: Build information}}
  /auth/login:
    post:
      summary: Console login; returns admin bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated}
        '401': {description: Invalid credentials}
  /auth/me:
    get:
      security: [{bearer: []}]
      summary: Current console user
      responses:
        '200': {description: User descriptor}
        '401': {description: Unauthorized}
  /activity:
    get:
      security: [{bearer: []}]
      summary: Recent console/simulation activity lines
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 250}
      responses:
        '200':
          description: Activity entries (JSON array)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActivityEntry'}
    post:
      security: [{bearer: []}]
      summary: Append one or many activity entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items: {$ref: '#/components/schemas/ActivityEntry'}
              additionalProperties: true
      responses:
        '200': {description: Accepted entries}
  /enroll:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, enrollment_token], properties: {name: {type: string}, enrollment_token: {type: string}, csr_pem: {type: string}}}}}}
      responses: {'201': {description: Site enrolled}, '401': {description: Bad bootstrap token}}
  /events:
    get:
      security: [{bearer: []}]
      summary: List recent ingested events (admin)
      parameters:
        - name: minutes
          in: query
          schema: {type: integer, minimum: 1}
        - name: site_id
          in: query
          schema: {type: string}
      responses: {"200": {description: Event list}}
    post:
      security: [{bearer: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventInput'}}}}
      responses: {"202": {description: Durably accepted}, "503": {description: Delivery queue unavailable}, "507": {description: Persistence failed}}
  /overview:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Fleet overview}}
  /sites:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Sites}}
  /routes:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Routes}}
    post:
      security: [{bearer: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Route'}}}}
      responses: {'201': {description: Route created}}
  /devices:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Devices}}
  /twins:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Device twins}}
  /twins/{id}/desired:
    put:
      security: [{bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Desired twin updated}}
  /deployments:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Deployments}}
    post:
      security: [{bearer: []}]
      responses: {'201': {description: Deployment created}}
  /deployments/{id}:
    patch:
      security: [{bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: string}
                image: {type: string}
                desired_state: {type: string, enum: [running, stopped]}
      responses: {'200': {description: Deployment updated}, '404': {description: Not found}}
    delete:
      security: [{bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}, '404': {description: Not found}}
  /alerts:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Alerts}}
  /deadletters:
    get:
      security: [{bearer: []}]
      responses: {'200': {description: Replayable dead letters}}
  /heartbeat:
    post:
      security: [{bearer: []}]
      summary: Site agent heartbeat
      responses: {"200": {description: Accepted}, "401": {description: Unauthorized}}
  /devices/register:
    post:
      security: [{bearer: []}]
      summary: Register or refresh a device under the calling site
      responses: {"200": {description: Device}, "201": {description: Created}}
  /agent/deployments:
    get:
      security: [{bearer: []}]
      summary: Deployments assigned to the calling site agent
      parameters:
        - name: site_id
          in: query
          schema: {type: string}
      responses: {"200": {description: Deployment list}}
  /agent/deployments/{id}/status:
    post:
      security: [{bearer: []}]
      summary: Agent reports deployment reconcile status
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Updated}, "404": {description: Not found}}
  /agent/twins:
    get:
      security: [{bearer: []}]
      summary: Desired twins for the calling site
      responses: {"200": {description: Twin list}}
  /agent/twins/{id}/reported:
    post:
      security: [{bearer: []}]
      summary: Agent reports twin state
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Updated}}
  /sites/{id}/revoke:
    post:
      security: [{bearer: []}]
      summary: Revoke a site (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Revoked}, "404": {description: Not found}}
  /routes/{id}:
    delete:
      security: [{bearer: []}]
      summary: Delete a cloud route
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"204": {description: Deleted}, "404": {description: Not found}}
  /alerts/{id}/resolve:
    post:
      security: [{bearer: []}]
      summary: Resolve an alert
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Resolved}, "404": {description: Not found}}
  /deadletters/{id}/replay:
    post:
      security: [{bearer: []}]
      summary: Re-queue a dead letter for delivery
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Replayed}, "404": {description: Not found}}
  /deadletters/{id}:
    delete:
      security: [{bearer: []}]
      summary: Drop a dead letter
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"204": {description: Deleted}, "404": {description: Not found}}
  /healthz:
    servers: [{url: /}]
    get:
      summary: Liveness probe
      responses: {"200": {description: OK}}
  /readyz:
    servers: [{url: /}]
    get:
      summary: Readiness (store + delivery/DLQ)
      responses: {"200": {description: Ready}, "503": {description: Not ready}}
  /metrics:
    servers: [{url: /}]
    get:
      summary: Prometheus text metrics
      responses: {"200": {description: Metrics}}
